<!DOCTYPE html>
<html lang="uz">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flashcard - Bilim kartalari</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">



<header>

<h1>🧠 Flashcard</h1>


<button id="themeBtn">
🌙
</button>


</header>







<main>


<section class="card-area">



<div class="flashcard" id="flashcard">


<div class="front">

<h2 id="question">
Savol
</h2>

<p>
Javobni ko'rish uchun bosing
</p>

</div>




<div class="back">

<h2 id="answer">
Javob
</h2>

</div>



</div>







<div class="buttons">


<button id="prev">
⬅ Oldingi
</button>


<button id="know">
✅ Bilaman
</button>


<button id="dontKnow">
❌ Bilmayman
</button>


<button id="next">
Keyingi ➡
</button>



</div>







<div class="progress">


<p id="progressText">
1 / 10
</p>


<div class="bar">

<div id="barFill">

</div>

</div>


</div>



</section>







<section class="add">


<h2>
➕ Yangi karta
</h2>


<input 
id="newQuestion"
placeholder="Savol">


<input 
id="newAnswer"
placeholder="Javob">


<button id="addCard">
Qo'shish
</button>


</section>





</main>






<footer>

Developer:
<b>Ulug'bek.R</b>

</footer>



</div>





<script src="script.js"></script>

</body>

</html>
